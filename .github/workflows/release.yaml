name: Release Automation

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/common-tests.yaml

  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bump2version

    - name: Configure Git
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

    - name: Bump version
      id: bump
      run: |
        CURRENT_VERSION=$(grep -Po '"version": "\K[^"]*' custom_components/dataprobe_dxp/manifest.json)
        BUMP_TYPE="${{ github.event.inputs.bump_type }}"
        echo "Current version: $CURRENT_VERSION"
        echo "Bump type: $BUMP_TYPE"
        bump2version --current-version "$CURRENT_VERSION" "$BUMP_TYPE"
        NEW_VERSION=$(grep -Po '"version": "\K[^"]*' custom_components/dataprobe_dxp/manifest.json)
        echo "New version: $NEW_VERSION"
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Push version bump
      run: |
        git push origin HEAD:${{ github.ref_name }}
        git push origin --tags

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.bump.outputs.version }}
        name: Release v${{ steps.bump.outputs.version }}
        generate_release_notes: true
        draft: false
        prerelease: false
